<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼성 나눔역 - 실시간 랭킹 현황판</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #f3f4f6; overflow: hidden; } /* 모니터용이므로 스크롤 숨김 */
    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .animate-heart { animation: pulse-heart 1.5s infinite; }
    
    @keyframes bobble {
      0%, 100% { transform: translateY(-50%); }
      50% { transform: translateY(calc(-50% - 4px)); }
    }
    .animate-train { animation: bobble 1.5s ease-in-out infinite; }
    
    /* 스크롤바 커스텀 (개인랭킹 영역) */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>

  <script>
    const SUPABASE_URL = 'https://rbkipjrmyigvkwdxtpge.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJia2lwanJteWlndmt3ZHh0cGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTMwOTEsImV4cCI6MjEwMTMyOTA5MX0.RXunWQCJFpZKi9aBfVEXFCCIj-S_HWSp5MiEdb-LiEA';
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- 아이콘 SVG ---
    const Heart = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
    const Trophy = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 3.31 2.69 6 6 6s6-2.69 6-6V2Z"/></svg>;
    const Train = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h0"/><path d="M16 15h0"/></svg>;
    const Users = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;

    const INITIAL_TEAMS = [
      { id: 'B', name: 'B호선', bgClass: 'bg-blue-500', textClass: 'text-blue-500', trackClass: 'border-blue-200' },
      { id: 'C', name: 'C호선', bgClass: 'bg-green-500', textClass: 'text-green-500', trackClass: 'border-green-200' },
      { id: 'D', name: 'D호선', bgClass: 'bg-red-500', textClass: 'text-red-500', trackClass: 'border-red-200' },
      { id: 'E', name: 'E호선', bgClass: 'bg-yellow-500', textClass: 'text-yellow-500', trackClass: 'border-yellow-200' },
      { id: 'J', name: 'J호선', bgClass: 'bg-purple-500', textClass: 'text-purple-500', trackClass: 'border-purple-200' },
      { id: 'K', name: 'K호선', bgClass: 'bg-pink-500', textClass: 'text-pink-500', trackClass: 'border-pink-200' },
      { id: 'L', name: 'L호선', bgClass: 'bg-teal-500', textClass: 'text-teal-500', trackClass: 'border-teal-200' },
    ];

    function LeaderboardApp() {
      const [players, setPlayers] = useState([]);
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
        fetchPlayers();
        // 5초마다 데이터 자동 갱신 (부스 모니터용)
        const interval = setInterval(fetchPlayers, 5000);
        return () => clearInterval(interval);
      }, []);

      const fetchPlayers = async () => {
        if (!window.supabaseClient) return;
        const { data, error } = await window.supabaseClient.from('players').select('*');
        if (!error && data) setPlayers(data);
      };

      // 개인 랭킹 (태깅, 게임 꼬리표 제거 및 병합)
      const individualRanking = useMemo(() => {
        const mergedPlayers = {};
        players.forEach(player => {
          // '(태깅)', '(연수원탐방)', '(미니게임)' 등 괄호 안의 모든 내용 제거
          const baseName = player.name.replace(/\(.*?\)/g, '').trim();
          if (!mergedPlayers[baseName]) {
            mergedPlayers[baseName] = { 
              name: baseName, 
              teamId: player.team_id || player.teamId, 
              score: 0 
            };
          }
          mergedPlayers[baseName].score += player.score;
        });
        return Object.values(mergedPlayers).sort((a, b) => b.score - a.score);
      }, [players]);

      // 팀 랭킹 합산
      const teamRanking = useMemo(() => {
        const teamScores = INITIAL_TEAMS.map(team => {
          const totalScore = players
            .filter(p => p.team_id === team.id || p.teamId === team.id)
            .reduce((sum, p) => sum + p.score, 0);
          return { ...team, totalScore };
        });
        return teamScores.sort((a, b) => b.totalScore - a.totalScore);
      }, [players]);

      const maxTeamScore = useMemo(() => {
        const max = Math.max(...teamRanking.map(t => t.totalScore));
        return max > 0 ? max : 100;
      }, [teamRanking]);

      const totalRaisedAmount = useMemo(() => {
        return players.reduce((sum, player) => sum + player.score, 0);
      }, [players]);

      return (
        <div className="w-screen h-screen bg-gray-50 flex flex-col font-sans overflow-hidden">
          
          {/* 헤더 */}
          <header className="bg-[#1428A0] text-white p-6 shadow-md flex justify-between items-center shrink-0 z-10">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center">
                <Heart className="w-6 h-6 text-pink-500 fill-current animate-heart" />
              </div>
              <div>
                <p className="text-blue-200 text-sm font-bold tracking-widest uppercase">SAMSUNG NANUM KIOSK</p>
                <h1 className="text-3xl font-black tracking-tight">삼성 나눔역 실시간 현황판</h1>
              </div>
            </div>
            
            <div className="flex items-end gap-3 bg-blue-900/50 px-8 py-3 rounded-2xl border border-blue-800">
              <span className="text-blue-200 text-lg font-bold mb-1">총 모금액</span>
              <span className="text-5xl font-black text-white">{totalRaisedAmount.toLocaleString()}</span>
              <span className="text-xl font-bold text-blue-200 mb-1">만원</span>
            </div>
          </header>

          {/* 메인 콘텐츠 (좌: 팀 랭킹 2/3, 우: 개인 랭킹 1/3) */}
          <main className="flex-1 flex gap-6 p-6 overflow-hidden">
            
            {/* === 좌측: 팀 랭킹 (메인) === */}
            <section className="w-2/3 bg-white rounded-3xl shadow-lg border border-gray-200 flex flex-col overflow-hidden relative">
              <div className="bg-gray-50 p-5 border-b border-gray-200 flex items-center gap-3">
                <Trophy className="w-7 h-7 text-[#1428A0]" />
                <h2 className="text-2xl font-black text-gray-800">누적 나눔 순위/h2>
                <span className="ml-auto text-sm text-gray-400 font-bold bg-white px-3 py-1 rounded-full border border-gray-200">실시간 자동 갱신 중</span>
              </div>
              
              <div className="flex-1 p-8 flex flex-col justify-around overflow-y-auto">
                {teamRanking.map((team, index) => {
                  const progress = mounted ? Math.max(5, Math.min(95, (team.totalScore / maxTeamScore) * 100)) : 5;
                  return (
                    <div key={team.id} className="w-full flex items-center gap-6 group">
                      {/* 순위 및 팀명 */}
                      <div className="w-32 shrink-0 flex items-center gap-3">
                        <span className="text-3xl w-10 text-center">
                          {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : <span className="text-gray-400 font-black text-xl">{index + 1}</span>}
                        </span>
                        <span className={`text-xl font-black ${index === 0 ? 'text-[#1428A0]' : 'text-gray-700'}`}>{team.name}</span>
                      </div>

                      {/* 열차 진행률 바 */}
                      <div className="flex-1 relative h-10">
                        {/* 배경 트랙 */}
                        <div className={`absolute top-1/2 -translate-y-1/2 w-full h-4 bg-gray-100 rounded-full border border-gray-200 flex items-center px-4 justify-between`}>
                          {[...Array(10)].map((_, i) => <div key={i} className="w-2 h-2 bg-white rounded-full opacity-50"></div>)}
                        </div>
                        
                        {/* 채워지는 트랙 */}
                        <div 
                          className={`absolute top-1/2 -translate-y-1/2 h-4 ${team.bgClass} rounded-full transition-all duration-1000 ease-out`} 
                          style={{ width: `${progress}%` }}
                        ></div>
                        
                        {/* 기차 아이콘 */}
                        <div 
                          className="absolute top-1/2 animate-train transition-all duration-1000 ease-out z-10" 
                          style={{ left: `calc(${progress}% - 24px)` }}
                        >
                          <div className={`w-12 h-12 bg-white rounded-full shadow-[0_4px_10px_rgba(0,0,0,0.15)] border-4 ${team.trackClass} flex items-center justify-center ${team.textClass}`}>
                            <Train className="w-6 h-6" />
                          </div>
                        </div>
                      </div>

                      {/* 점수 */}
                      <div className="w-32 shrink-0 text-right">
                        <span className={`text-2xl font-black ${index === 0 ? 'text-[#1428A0]' : 'text-gray-800'}`}>
                          {team.totalScore.toLocaleString()}
                        </span>
                        <span className="text-base text-gray-500 font-bold ml-1">만원</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* === 우측: 개인 랭킹 (서브) === */}
            <section className="w-1/3 bg-white rounded-3xl shadow-lg border border-gray-200 flex flex-col overflow-hidden">
              <div className="bg-gray-50 p-5 border-b border-gray-200 flex items-center gap-3">
                <Users className="w-7 h-7 text-[#1428A0]" />
                <h2 className="text-xl font-black text-gray-800">명예의 전당 (Top 15)</h2>
              </div>

              <div className="flex-1 overflow-y-auto p-2">
                {individualRanking.length === 0 ? (
                  <div className="h-full flex items-center justify-center text-gray-400 font-bold">아직 참여 기록이 없습니다.</div>
                ) : (
                  // 스크롤을 방지하고 깔끔하게 보여주기 위해 Top 15만 렌더링
                  individualRanking.slice(0, 15).map((player, index) => {
                    const teamInfo = INITIAL_TEAMS.find(t => t.id === player.teamId) || { name: '알수없음', textClass: 'text-gray-500', bgClass: 'bg-gray-100' };
                    
                    return (
                      <div key={index} className={`flex items-center p-4 border-b border-gray-100 last:border-b-0 transition-colors ${index < 3 ? 'bg-blue-50/40' : 'hover:bg-gray-50'}`}>
                        <div className="w-12 flex justify-center shrink-0 text-2xl">
                          {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : <span className="text-gray-400 font-black text-lg">{index + 1}</span>}
                        </div>
                        
                        <div className="flex-1 ml-2 flex flex-col">
                          <div className={`text-lg font-bold truncate ${index < 3 ? 'text-[#1428A0]' : 'text-gray-800'}`}>
                            {player.name}
                          </div>
                          <div className="flex items-center gap-1.5 mt-0.5">
                            <span className={`w-2 h-2 rounded-full ${teamInfo.bgClass}`}></span>
                            <span className="text-xs text-gray-500 font-bold">{teamInfo.name}</span>
                          </div>
                        </div>

                        <div className={`font-black shrink-0 text-xl text-right ${index < 3 ? 'text-[#1428A0]' : 'text-gray-700'}`}>
                          {player.score.toLocaleString()} <span className="text-sm font-bold text-gray-400">만원</span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </section>
            
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LeaderboardApp />);
  </script>
</body>
</html>
